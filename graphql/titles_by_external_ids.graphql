query TitlesByExternalIds($source: String!, $values: [String!]!) { titlesByExternalIds(source: $source, values: $values) { ...TitleFields } }

fragment TitleFields on TitlePayload {
  id libraryId name facet monitored year slug overview tags
  externalIds { source value }
  imdbId qualityProfileId rootFolderPath minAvailability monitorType sizeBytes
  episodesOwned episodesMonitored episodesTotal createdAt posterUrl
}
