query QueuePage($limit: Int!, $offset: Int!, $withScope: Boolean!) { downloadQueuePage(limit: $limit, offset: $offset, scryerSubmittedOnly: false) { items { id titleId episodeId titleName facet clientId clientType downloadClientItemId downloadId displayState trackedState progressPercent sizeBytes remainingSeconds sourceProvider queueScope @include(if: $withScope) { __typename ... on EpisodeScopePayload { episodeId } ... on EpisodeSetScopePayload { episodeIds } ... on CollectionScopePayload { collectionId } } title { id libraryId externalIds { source value } } } hasMore totalCount } }
