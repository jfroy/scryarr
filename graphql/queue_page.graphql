query QueuePage($limit: Int!, $offset: Int!) { downloadQueuePage(limit: $limit, offset: $offset, scryerSubmittedOnly: false) { items { id titleId episodeId titleName facet clientId clientType downloadClientItemId downloadId displayState trackedState progressPercent sizeBytes remainingSeconds sourceProvider title { id libraryId externalIds { source value } } } hasMore totalCount } }
