[package]
name = "scryarr"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
name = "scryarr"
path = "src/lib.rs"

[[bin]]
name = "scryarr"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
graphql_client = "0.14"
scryer-plugin-sdk = "=3.20.0"
prometheus = "0.14"
base64 = "0.22"
subtle = "2"

[dev-dependencies]
wiremock = "0.6"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
