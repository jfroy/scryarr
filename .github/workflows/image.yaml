name: image

# Check that the image builds. Only release.yaml publishes; main builds
# still run so tag builds can reuse main's cache.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
