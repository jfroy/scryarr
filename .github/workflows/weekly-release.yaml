name: weekly-release

# Cut a patch release once a week when pull requests (dependency updates
# included) have merged since the last release.

on:
  schedule:
    - cron: "17 15 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-commit
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: changes
        name: Look for pull requests merged since the last release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(git describe --tags --abbrev=0 --match 'v*')"
          since="$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ "$tag")"
          prs="$(gh pr list --state merged --base main --search "merged:>${since}" --json number --jq length)"
          commits="$(git rev-list --count "${tag}..HEAD")"
          echo "last release ${tag} at ${since}: ${prs} pull requests merged, ${commits} commits since"
          if [ "$prs" -gt 0 ] && [ "$commits" -gt 0 ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.changes.outputs.release == 'true'
        name: Bump the patch version, tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/release.sh
